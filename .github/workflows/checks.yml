name: Checks

# Lint, and the profile modules' checks on both clients (Tools/offline/check.lua:
# the addon loaded outside the game). Run by hand only (Actions > Checks > Run
# workflow): the same checks run on the PC before every release (/release), and
# the runner's package downloads failed too often to trust on every push.
on:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y lua5.1 luarocks
      - run: sudo luarocks install luacheck
      - run: luacheck . -q
      - run: lua5.1 Tools/offline/check.lua
